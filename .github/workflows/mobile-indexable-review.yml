name: Mobile fixes and indexable release
on:
  push:
    branches: [mobile-indexable-release-20261125]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate indexable release
        run: |
          python3 v3-release/prepare_seo.py --source v3 --output release-indexable --site-url https://salutrussie.ru/ --enable-indexing
          python3 v3-release/validate_release.py --root release-indexable --site-url https://salutrussie.ru/ --indexable
          test ! -e release-indexable/.htaccess
      - name: Install browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium webkit
      - name: Test cards, footer and consultation in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --directory release-indexable >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node v3-release/test-mobile-fixes.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-review-report
          path: mobile-review/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: salutrussie-indexable-mobile-fixed-2026-11-25
          path: release-indexable/
          retention-days: 7
